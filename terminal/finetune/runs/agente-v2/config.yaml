# LoRA sobre Qwen3-4B-Instruct-2507 (4 bits, MLX) para el modo agente de LegacyLift.
# Basado en la corrida dia3 de ml/ (mismo equipo M5 16 GB), ajustado a ejemplos largos con herramientas.
train: true
fine_tune_type: lora
data: finetune/datos/dataset-v2
seed: 42
num_layers: 16            # capas con LoRA (menos que dia3: secuencias 8x más largas)
batch_size: 1
grad_accumulation_steps: 4   # batch efectivo 4
iters: 700
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments: [1.0e-4, 700, 1.0e-6]
steps_per_report: 10
steps_per_eval: 100
val_batches: 40
save_every: 100
max_seq_length: 7300      # el ejemplo más largo tiene 7126 tokens
grad_checkpoint: true
mask_prompt: true         # solo se aprende la respuesta (herramienta o informe), no el historial
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
