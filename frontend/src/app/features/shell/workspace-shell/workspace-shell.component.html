<div class="app-shell">
  <div *ngIf="vm.mobileNavOpen" class="mobile-backdrop" (click)="vm.mobileNavOpen=false" aria-hidden="true"></div>
  <ll-project-sidebar/>
  <div class="shell-body" id="workspace-top">
    <ll-workspace-topbar/>
    <ll-project-dashboard/>
  </div>
  <div class="toast-region" aria-live="polite">
    <ll-notice *ngIf="vm.notice" class="toast" [message]="vm.notice" (dismissed)="vm.dismiss()"/>
  </div>
</div>
