<div class="graph" *ngIf="nodes.length">
  <div class="graph-head">
    <div>
      <strong>Módulos detectados ({{graph.nodes.length}})</strong>
      <small>Selecciona un módulo para ver sus dependencias.</small>
    </div>
    <span class="graph-badge">{{graph.edges.length}} relaciones</span>
  </div>

  <div class="module-pills" role="group" aria-label="Mapa interactivo de módulos">
    <button *ngFor="let n of nodes" type="button" class="module-pill"
      [class.active]="active?.id===n.id"
      (click)="select(n)"
      (keydown.enter)="select(n)"
      [attr.aria-pressed]="active?.id===n.id">
      <strong>{{n.label}}</strong>
      <small>{{n.files}} {{n.files===1?'archivo':'archivos'}}</small>
    </button>
  </div>

  <div class="node-summary-box" *ngIf="active">
    <div class="node-summary-head">
      <strong>{{active.label}}</strong>
      <span class="module-role" [attr.data-layer]="active.layer">{{active.roleLabel}}</span>
    </div>
    <div class="dep-inline">
      <span><strong>Importa ({{active.imports.length}}):</strong> {{importsText}}</span>
      <span><strong>Usado por ({{active.importedBy.length}}):</strong> {{importedByText}}</span>
    </div>
  </div>
</div>
