<section class="panel artifacts-panel" *ngIf="vm.selected as p" id="artifacts" aria-label="Artefactos generados">
  <nav class="artifact-index" aria-label="Seleccionar artefacto">
    <div class="index-group" *ngFor="let g of groups">
      <span class="index-label">{{g.label}}</span>
      <button type="button" *ngFor="let f of g.files" [class.selected]="vm.artifactName===f" (click)="vm.openArtifact(f)" [attr.aria-current]="vm.artifactName===f?'true':null">
        <ll-icon [name]="f.endsWith('.patch') ? 'difference' : f.endsWith('.json') ? 'data_object' : 'description'" size="sm"/><span>{{f}}</span></button>
    </div>
    <p class="index-empty" *ngIf="!p.artifacts?.length">Cada paso que ejecutes añadirá aquí su documento.</p>
  </nav>

  <div class="artifact-document" *ngIf="vm.artifactContent; else noArtifact">
    <div class="document-bar"><span class="mono">{{vm.artifactName}}</span>
      <button llButton variant="ghost" size="sm" type="button" (click)="vm.copyArtifact()" [disabled]="!vm.artifactContent"><ll-icon name="content_copy" size="sm"/> Copiar</button>
      <button llButton variant="ghost" size="sm" type="button" (click)="vm.download()"><ll-icon name="download" size="sm"/> Exportar ZIP</button>
    </div>
    <div *ngIf="vm.rendered;else plainText" class="markdown-view" [innerHTML]="vm.rendered"></div>
    <ng-template #plainText><pre class="raw-view">{{vm.artifactContent}}</pre></ng-template>
  </div>
  <ng-template #noArtifact><div class="artifact-placeholder"><ll-icon name="draft" size="lg"/><strong>Elige un documento</strong>
    <p>Selecciona un artefacto de la lista para leerlo aquí.</p></div></ng-template>
</section>
