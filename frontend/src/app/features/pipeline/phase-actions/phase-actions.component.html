<section class="next-step" *ngIf="guide as g" [attr.data-tone]="g.tone" aria-live="polite" aria-atomic="true">
  <span class="next-icon" aria-hidden="true"><ll-icon [name]="g.icon"/></span>
  <div class="next-copy">
    <span class="next-kicker">{{g.kicker}}</span>
    <strong class="next-title">{{g.title}}</strong>
    <p>{{g.detail}}</p>
    <div *ngIf="g.progress !== null && g.progress !== undefined" class="ll-progress" role="progressbar" aria-label="Progreso"
      [attr.aria-valuenow]="g.progress" aria-valuemin="0" aria-valuemax="100"><span [style.width.%]="g.progress"></span></div>
  </div>
  <div class="next-actions" *ngIf="g.primary || g.rerun">
    <button *ngIf="g.rerun" llButton variant="ghost" size="sm" type="button" (click)="vm.run()"
      [disabled]="!vm.stageRunnable || vm.busy || vm.ingestRunning" title="Genera de nuevo el resultado de este paso">
      <ll-icon name="refresh" size="sm"/> Volver a ejecutar</button>
    <button *ngIf="g.primary as a" llButton variant="primary" type="button" class="run-button" (click)="act(a)" [disabled]="!!a.disabled">
      <ll-icon [name]="a.icon" size="sm"/> {{a.label}}</button>
  </div>
</section>
